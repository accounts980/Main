<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" fill="#243247"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A8AA0"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5525A"/></marker></defs><rect width="1000" height="300" fill="#FFFFFF"/><text x="20" y="26" font-size="14" font-weight="700" text-anchor="start" fill="#243247">One way of working for every transaction table</text><rect x="20" y="50" width="250" height="150" rx="8" fill="#FFF4D6" stroke="#D9E0E8" stroke-width="1.2"/><text x="34" y="74" font-size="12" font-weight="700" text-anchor="start" fill="#243247">ENTRY PAD</text><text x="34" y="94" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">~200 rows, same columns as register</text><text x="34" y="112" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">lookups: one MATCH per key</text><text x="34" y="130" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">checks against balances</text><text x="34" y="148" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">pad totals per lot / batch / product</text><text x="34" y="166" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">Ready flag = all checks pass</text><line x1="272" y1="110" x2="368" y2="110" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)"/><text x="320" y="92" font-size="10" font-weight="700" text-anchor="middle" fill="#243247">POST</text><text x="320" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#243247">values + ID</text><rect x="370" y="50" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1.2"/><rect x="370" y="50" width="250" height="30" rx="8" fill="#E2F0E8"/><text x="384" y="70" font-size="12" font-weight="700" text-anchor="start" fill="#243247">REGISTER (Excel Table)</text><text x="384" y="100" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">values only - no formulas</text><text x="384" y="118" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">append-only; permanent IDs</text><text x="384" y="136" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">snapshots: rate, weight, UOM</text><text x="384" y="154" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">corrections = reversal rows</text><text x="384" y="172" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">up to 100,000 rows per FY file</text><line x1="622" y1="110" x2="718" y2="110" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)"/><text x="670" y="92" font-size="10" font-weight="700" text-anchor="middle" fill="#243247">REFRESH</text><text x="670" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#243247">group-by</text><rect x="720" y="50" width="260" height="150" rx="8" fill="#D9F0EF" stroke="#D9E0E8" stroke-width="1.2"/><text x="734" y="74" font-size="12" font-weight="700" text-anchor="start" fill="#243247">BALANCE (open items only)</text><text x="734" y="94" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">Power Query group-by or</text><text x="734" y="112" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">bounded SUMIFS</text><text x="734" y="130" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">lots · batches · JWC lines · FG · WIP</text><text x="734" y="148" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">stores register row count</text><text x="734" y="166" font-size="10.5" font-weight="400" text-anchor="start" fill="#243247">-&gt; STALE guard blocks entry</text><path d="M850 202 V240 H145 V204" fill="none" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)"/><text x="497" y="256" font-size="10.5" font-weight="600" text-anchor="middle" fill="#243247">hard stops in the pad read the balance (available kg, batch kg left, JWC pending, FG available)</text><line x1="495" y1="202" x2="495" y2="228" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="505" y="222" font-size="9.5" font-weight="400" text-anchor="start" fill="#4A5A70">X_ extract to other books / MIS</text><text x="20" y="288" font-size="10" font-weight="400" text-anchor="start" fill="#4A5A70">Macro option: the POST button does copy-values, ID, Posted At/By and refresh in one step. Manual option: Copy → Paste Values, then Refresh All.</text></svg>