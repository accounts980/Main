<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" fill="#243247"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A8AA0"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5525A"/></marker></defs><rect width="1100" height="690" fill="#FFFFFF"/><text x="20" y="28" font-size="15" font-weight="700" text-anchor="start" fill="#243247">Four-workbook target architecture - ownership, values extracts, refresh points, permanent IDs</text><text x="20" y="48" font-size="11" font-weight="400" text-anchor="start" fill="#4A5A70">Arrows = Power Query values extracts (replace, never append) refreshed at defined points; every refresh writes a Refresh Log row.</text><rect x="20" y="70" width="300" height="400" rx="8" fill="#F7F9FC" stroke="#D9E0E8" stroke-width="1.2"/><path d="M20 78 a8 8 0 0 1 8 -8 h284 a8 8 0 0 1 8 8 v34 h-300 z" fill="#DCEAF7"/><text x="34" y="92" font-size="13.5" font-weight="700" text-anchor="start" fill="#243247">1  STORES</text><text x="34" y="107" font-size="10" font-weight="400" text-anchor="start" fill="#4A5A70">Owner: Stores head</text><rect x="32" y="132" width="276" height="34" rx="6" fill="#FFF4D6" stroke="#D9E0E8" stroke-width="1.2"/><text x="40" y="146" font-size="9.5" font-weight="700" text-anchor="start" fill="#243247">ENTRY PADS (~200 rows, all checks)</text><text x="40" y="159" font-size="9.5" font-weight="400" text-anchor="start" fill="#243247">PO · GRN · Lot QC · RM move · Consumable · Adjust</text><rect x="32" y="176" width="276" height="90" rx="6" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1.2"/><text x="40" y="190" font-size="9.5" font-weight="700" text-anchor="start" fill="#243247">REGISTERS - values only, append-only</text><text x="40" y="204" font-size="10" font-weight="400" text-anchor="start" fill="#243247">tblPOHead / tblPOLine</text><text x="40" y="218" font-size="10" font-weight="400" text-anchor="start" fill="#243247">tblGRN · tblLotQC</text><text x="40" y="232" font-size="10" font-weight="400" text-anchor="start" fill="#243247">tblRMMove (issue = batch)</text><text x="40" y="246" font-size="10" font-weight="400" text-anchor="start" fill="#243247">tblConsRcpt · tblConsIssue</text><text x="40" y="260" font-size="10" font-weight="400" text-anchor="start" fill="#243247">tblAdjust (authorised)</text><rect x="32" y="276" width="276" height="62" rx="6" fill="#D9F0EF" stroke="#D9E0E8" stroke-width="1.2"/><text x="40" y="290" font-size="9.5" font-weight="700" text-anchor="start" fill="#243247">BALANCES - rebuilt on posting</text><text x="40" y="304" font-size="10" font-weight="400" text-anchor="start" fill="#243247">Lot Balance (open lots)</text><text x="40" y="318" font-size="10" font-weight="400" text-anchor="start" fill="#243247">Consumable Balance</text><text x="40" y="332" font-size="10" font-weight="400" text-anchor="start" fill="#243247">PO Status (open lines)</text><rect x="32" y="348" width="276" height="48" rx="6" fill="#EAE4F8" stroke="#D9E0E8" stroke-width="1.2"/><text x="40" y="362" font-size="9.5" font-weight="700" text-anchor="start" fill="#243247">MASTERS OWNED</text><text x="40" y="376" font-size="10" font-weight="400" text-anchor="start" fill="#243247">Material · Grade · Supplier</text><text x="40" y="390" font-size="10" font-weight="400" text-anchor="start" fill="#243247">Consumable · Category · Where-used</text><rect x="400" y="70" width="300" height="400" rx="8" fill="#F7F9FC" stroke="#D9E0E8" stroke-width="1.2"/><path d="M400 78 a8 8 0 0 1 8 -8 h284 a8 8 0 0 1 8 8 v34 h-300 z" fill="#DCEAF7"/><text x="414" y="92" font-size="13.5" font-weight="700" text-anchor="start" fill="#243247">2  PRODUCTION</text><text x="414" y="107" font-size="10" font-weight="400" text-anchor="st