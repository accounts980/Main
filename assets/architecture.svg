roke-width="1.2"/><text x="800" y="334" font-size="9.5" font-weight="700" text-anchor="start" fill="#243247">MASTERS OWNED</text><text x="800" y="348" font-size="10" font-weight="400" text-anchor="start" fill="#243247">Customer · Customer price &amp; UOM</text><text x="800" y="362" font-size="10" font-weight="400" text-anchor="start" fill="#243247">Vendor · Coater rate (dated)</text><line x1="322" y1="150" x2="398" y2="150" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)"/><text x="360" y="128" font-size="9.5" font-weight="600" text-anchor="middle" fill="#243247">X_Batch</text><text x="360" y="139" font-size="9.5" font-weight="600" text-anchor="middle" fill="#243247">X_Material</text><text x="360" y="166" font-size="8.5" font-weight="400" text-anchor="middle" fill="#4A5A70">start of shift</text><line x1="398" y1="210" x2="322" y2="210" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)"/><text x="360" y="228" font-size="9.5" font-weight="600" text-anchor="middle" fill="#243247">X_Product</text><text x="360" y="239" font-size="9.5" font-weight="600" text-anchor="middle" fill="#243247">X_Machine</text><text x="360" y="250" font-size="9.5" font-weight="600" text-anchor="middle" fill="#243247">X_People</text><line x1="702" y1="150" x2="778" y2="150" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)"/><text x="740" y="128" font-size="9.5" font-weight="600" text-anchor="middle" fill="#243247">X_ProdOutput</text><text x="740" y="139" font-size="9.5" font-weight="600" text-anchor="middle" fill="#243247">X_Product</text><text x="740" y="166" font-size="8.5" font-weight="400" text-anchor="middle" fill="#4A5A70">start of shift</text><line x1="778" y1="210" x2="702" y2="210" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)"/><text x="740" y="228" font-size="9.5" font-weight="600" text-anchor="middle" fill="#243247">X_Customer</text><line x1="170" y1="472" x2="170" y2="528" stroke="#7A8AA0" stroke-width="1.6" marker-end="url(#ar)"/><line x1="550" y1