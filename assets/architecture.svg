.5" font-weight="400" text-anchor="start" fill="#243247">director KPIs from small</text><text x="460" y="623" font-size="9.5" font-weight="400" text-anchor="start" fill="#243247">Power Query summaries</text><rect x="658" y="576" width="196" height="80" rx="6" fill="#E2F0E8" stroke="#D9E0E8" stroke-width="1.2"/><text x="668" y="594" font-size="11" font-weight="700" text-anchor="start" fill="#243247">Trace</text><text x="668" y="610" font-size="9.5" font-weight="400" text-anchor="start" fill="#243247">lot → batch → part → JWC → DC</text><text x="668" y="623" font-size="9.5" font-weight="400" text-anchor="start" fill="#243247">PO → GRN chain (by ID)</text><rect x="866" y="576" width="196" height="80" rx="6" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1.2"/><text x="876" y="594" font-size="11" font-weight="700" text-anchor="start" fill="#243247">Monthly packs</text><text x="876" y="610" font-size="9.5" font-weight="400" text-anchor="start" fill="#243247">MRM · yield · scrap</text><text x="876" y="623" font-size="9.5" font-weight="400" text-anchor="start" fill="#243247">PivotTables + slicers</text></svg>